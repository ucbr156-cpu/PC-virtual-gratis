version: "3.8"

services:
  backend:
    build: ./backend
    container_name: cloudpc-backend
    ports:
      - "3000:3000"
    volumes:
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
    restart: unless-stopped

  novnc:
    image: theasp/novnc:latest
    container_name: cloudpc-novnc
    ports:
      - "6080:8080"
    command:
      - "--vnc"
      - "host.docker.internal:5900"
      - "--listen"
      - "0.0.0.0:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    {
  "name": "cloud-pc-backend",
  "version": "1.0.0",
  "main": "server.js",
  "scripts": {
    "start": "node server.js"
  },
  "dependencies": {
    "express": "^4.21.2",
    "express-session": "^1.18.1"
  }
}
const express = require("express");
const session = require("express-session");
const { execFile } = require("child_process");

const app = express();
const PORT = 3000;

const VM_NAME = "cloudpc-demo";
const USER = "demo";
const PASSWORD = "demo";

app.use(express.json());

app.use(session({
  secret: "troque-esta-chave-em-producao",
  resave: false,
  saveUninitialized: false,
  cookie: {
    httpOnly: true,
    secure: false
  }
}));

function virsh(args) {
  return new Promise((resolve, reject) => {
    execFile("virsh", args, (error, stdout, stderr) => {
      if (error) {
        reject(new Error(stderr || error.message));
        return;
      }

      resolve(stdout.trim());
    });
  });
}

app.post("/api/login", (req, res) => {
  const { username, password } = req.body;

  if (username === USER && password === PASSWORD) {
    req.session.loggedIn = true;

    return res.json({
      success: true,
      message: "Login realizado com sucesso"
    });
  }

  res.status(401).json({
    success: false,
    message: "Usuário ou senha incorretos"
  });
});

function auth(req, res, next) {
  if (!req.session.loggedIn) {
    return res.status(401).json({
      error: "Não autenticado"
    });
  }

  next();
}

app.get("/api/status", auth, async (req, res) => {
  try {
    const status = await virsh(["domstate", VM_NAME]);

    res.json({
      vm: VM_NAME,
      status
    });
  } catch (error) {
    res.status(500).json({
      error: error.message
    });
  }
});

app.post("/api/start", auth, async (req, res) => {
  try {
    await virsh(["start", VM_NAME]);

    res.json({
      success: true,
      message: "VM iniciada"
    });
  } catch (error) {
    res.status(500).json({
      error: error.message
    });
  }
});

app.post("/api/stop", auth, async (req, res) => {
  try {
    await virsh(["shutdown", VM_NAME]);

    res.json({
      success: true,
      message: "Comando de desligamento enviado"
    });
  } catch (error) {
    res.status(500).json({
      error: error.message
    });
  }
});

app.post("/api/reboot", auth, async (req, res) => {
  try {
    await virsh(["reboot", VM_NAME]);

    res.json({
      success: true,
      message: "VM reiniciada"
    });
  } catch (error) {
    res.status(500).json({
      error: error.message
    });
  }
});

app.post("/api/logout", auth, (req, res) => {
  req.session.destroy(() => {
    res.json({
      success: true
    });
  });
});

app.listen(PORT, () => {
  console.log(`Cloud PC Backend rodando na porta ${PORT}`);
});

FROM node:20-bookworm

WORKDIR /app

RUN apt-get update && \
    apt-get install -y libvirt-clients && \
    rm -rf /var/lib/apt/lists/*

COPY package.json .

RUN npm install

COPY server.js .

EXPOSE 3000

CMD ["npm", "start"]

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cloud PC Gaming</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 25px;
    }

    .login {
      max-width: 400px;
      margin: 100px auto;
      background: #1e293b;
      padding: 30px;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 0;
      border-radius: 8px;
    }

    button {
      border: 0;
      padding: 12px 18px;
      margin: 5px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .login button {
      width: 100%;
      margin: 10px 0 0;
    }

    .dashboard {
      display: none;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    #status {
      font-weight: bold;
      color: #22c55e;
    }

    .screen {
      width: 100%;
      height: 650px;
      border: 0;
      border-radius: 12px;
      background: black;
    }

    .error {
      color: #ef4444;
      margin-top: 10px;
    }

    .info {
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="login" id="loginBox">

      <h1>Cloud PC Gaming</h1>

      <p class="info">
        Acesse seu computador virtual.
      </p>

      <br>

      <input
        type="text"
        id="username"
        placeholder="Usuário"
      >

      <input
        type="password"
        id="password"
        placeholder="Senha"
      >

      <button onclick="login()">
        Entrar
      </button>

      <p class="error" id="loginError"></p>

      <p class="info">
        Demo: demo / demo
      </p>

    </div>

    <div class="dashboard" id="dashboard">

      <div class="top">

        <div>
          <h1>Meu Cloud PC</h1>

          <p class="info">
            Computador virtual online
          </p>
        </div>

        <button onclick="logout()">
          Sair
        </button>

      </div>

      <div class="card">

        <h2>Status da VM</h2>

        <br>

        <p>
          Estado:
          <span id="status">
            verificando...
          </span>
        </p>

        <br>

        <button onclick="startVM()">
          ▶ Ligar
        </button>

        <button onclick="rebootVM()">
          🔄 Reiniciar
        </button>

        <button onclick="stopVM()">
          ⏹ Desligar
        </button>

        <button onclick="getStatus()">
          🔃 Atualizar
        </button>

      </div>

      <div class="card">

        <h2>Tela do Cloud PC</h2>

        <p class="info">
          A tela remota aparecerá abaixo quando o serviço estiver configurado.
        </p>

        <br>

        <iframe
          id="remoteScreen"
          class="screen"
          src="about:blank"
          allow="fullscreen"
        ></iframe>

      </div>

    </div>

  </div>

  <script>

    const API = "http://" + window.location.hostname + ":3000";

    async function login() {

      const username =
        document.getElementById("username").value;

      const password =
        document.getElementById("password").value;

      const error =
        document.getElementById("loginError");

      error.textContent = "";

      try {

        const response = await fetch(
          API + "/api/login",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              username,
              password
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Erro no login");
        }

        document.getElementById("loginBox")
          .style.display = "none";

        document.getElementById("dashboard")
          .style.display = "block";

        getStatus();

        document.getElementById("remoteScreen").src =
          "http://" +
          window.location.hostname +
          ":6080/vnc.html?autoconnect=true&resize=scale";

      } catch (err) {

        error.textContent = err.message;

      }

    }

    async function getStatus() {

      try {

        const response = await fetch(
          API + "/api/status"
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error);
        }

        document.getElementById("status")
          .textContent = data.status;

      } catch (error) {

        document.getElementById("status")
          .textContent = "offline";

      }

    }

    async function startVM() {
      await action("/api/start");
      setTimeout(getStatus, 2000);
    }

    async function stopVM() {
      await action("/api/stop");
      setTimeout(getStatus, 2000);
    }

    async function rebootVM() {
      await action("/api/reboot");
      setTimeout(getStatus, 2000);
    }

    async function action(endpoint) {

      try {

        const response = await fetch(
          API + endpoint,
          {
            method: "POST"
          }
        );

        const data = await response.json();

        if (!response.ok) {
          alert(data.error || "Erro");
          return;
        }

        alert(data.message);

      } catch (error) {

        alert(
          "Não foi possível conectar ao servidor."
        );

      }

    }

    async function logout() {

      try {

        await fetch(
          API + "/api/logout",
          {
            method: "POST"
          }
        );

      } finally {

        location.reload();

      }

    }

  </script>

</body>
</html>
